# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/revio_db}
spring.data.mongodb.auto-index-creation=true

# Application Name
spring.application.name=revio-backend

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production-environment-12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
app.cors.allowed-origins=https://mellow-youthfulness.up.railway.app,http://localhost:3000

# Logging
logging.level.root=INFO
logging.level.com.revio=DEBUG

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin

# Date Format
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
