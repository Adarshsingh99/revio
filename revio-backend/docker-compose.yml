version: '3.8'

services:
  # Spring Boot Application
  app:
    build: .
    container_name: revio_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/revio_db?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production-environment-12345678901234567890
      JWT_EXPIRATION: 86400000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - revio_network

  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: revio_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: revio_db
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      # Persist data even after container stops
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - revio_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Optional: MongoDB Express (Web UI for MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: revio_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - revio_network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  revio_network:
    driver: bridge
